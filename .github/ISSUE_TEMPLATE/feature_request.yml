name: Feature request
description: Suggest an improvement for Dockhand Android
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste secrets.** Never include API tokens, server URLs, hostnames or IP addresses.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the app do instead?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown at the top of the Settings screen
    validations:
      required: false
