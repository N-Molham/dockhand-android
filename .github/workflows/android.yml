name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK to build"
        type: choice
        options:
          - debug
          - release
          - both
        default: debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: ${{ inputs.build_type != 'debug' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.DOCKHAND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "DOCKHAND_KEYSTORE_BASE64 secret not set; release build will be unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DOCKHAND_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build, test and lint
        env:
          DOCKHAND_KEYSTORE_PASSWORD: ${{ secrets.DOCKHAND_KEYSTORE_PASSWORD }}
          DOCKHAND_KEY_ALIAS: ${{ secrets.DOCKHAND_KEY_ALIAS }}
          DOCKHAND_KEY_PASSWORD: ${{ secrets.DOCKHAND_KEY_PASSWORD }}
        run: |
          TASKS="testDebugUnitTest lintDebug"
          if [ "${{ inputs.build_type }}" != "release" ]; then
            TASKS="$TASKS assembleDebug"
          fi
          if [ "${{ inputs.build_type }}" != "debug" ]; then
            TASKS="$TASKS assembleRelease"
          fi
          ./gradlew $TASKS

      - name: Upload debug APK
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: dockhand-android-debug-v${{ steps.app_version.outputs.version }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: ${{ inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: dockhand-android-release-v${{ steps.app_version.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
