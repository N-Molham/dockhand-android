name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK to build"
        type: choice
        options:
          - debug
          - release
          - both
        default: debug
      tag_and_release:
        description: "Tag v<version> and publish a GitHub release with changelog"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/android-setup

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: ${{ inputs.build_type != 'debug' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.DOCKHAND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "DOCKHAND_KEYSTORE_BASE64 secret not set; release build will be unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DOCKHAND_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble APKs
        env:
          DOCKHAND_KEYSTORE_PASSWORD: ${{ secrets.DOCKHAND_KEYSTORE_PASSWORD }}
          DOCKHAND_KEY_ALIAS: ${{ secrets.DOCKHAND_KEY_ALIAS }}
          DOCKHAND_KEY_PASSWORD: ${{ secrets.DOCKHAND_KEY_PASSWORD }}
        run: |
          TASKS=""
          if [ "${{ inputs.build_type }}" != "release" ]; then
            TASKS="$TASKS assembleDebug"
          fi
          if [ "${{ inputs.build_type }}" != "debug" ]; then
            TASKS="$TASKS assembleRelease"
          fi
          SHRINK="false"
          if [ "${{ inputs.tag_and_release }}" = "true" ]; then
            SHRINK="true"
          fi
          ./gradlew $TASKS -Pdockhand.shrinkResources=$SHRINK

      - name: Upload debug APK
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockhand-android-debug-v${{ steps.app_version.outputs.version }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        if: ${{ inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockhand-android-release-v${{ steps.app_version.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: ignore

  release:
    needs: [verify, assemble]
    if: ${{ inputs.tag_and_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dockhand-android-*
          merge-multiple: true
          path: dist

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists. Bump version.properties before releasing."
            exit 1
          fi
          ls -la dist
          gh release create "v$VERSION" dist/*.apk \
            --title "Dockhand Android v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
