name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK to build"
        type: choice
        options:
          - debug
          - release
          - both
        default: debug
      tag_and_release:
        description: "Tag v<version> and publish a GitHub release with changelog"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: ${{ inputs.build_type != 'debug' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.DOCKHAND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "DOCKHAND_KEYSTORE_BASE64 secret not set; release build will be unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DOCKHAND_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build, test and lint
        env:
          DOCKHAND_KEYSTORE_PASSWORD: ${{ secrets.DOCKHAND_KEYSTORE_PASSWORD }}
          DOCKHAND_KEY_ALIAS: ${{ secrets.DOCKHAND_KEY_ALIAS }}
          DOCKHAND_KEY_PASSWORD: ${{ secrets.DOCKHAND_KEY_PASSWORD }}
        run: |
          TASKS="testDebugUnitTest lintDebug"
          if [ "${{ inputs.build_type }}" != "release" ]; then
            TASKS="$TASKS assembleDebug"
          fi
          if [ "${{ inputs.build_type }}" != "debug" ]; then
            TASKS="$TASKS assembleRelease"
          fi
          ./gradlew $TASKS

      - name: Upload debug APK
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockhand-android-debug-v${{ steps.app_version.outputs.version }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload signed release APK
        if: ${{ inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockhand-android-release-v${{ steps.app_version.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Tag and publish release
        if: ${{ inputs.tag_and_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists. Bump version.properties before releasing."
            exit 1
          fi
          FILES=""
          if [ "${{ inputs.build_type }}" != "release" ]; then
            FILES="$FILES app/build/outputs/apk/debug/app-debug.apk"
          fi
          if [ "${{ inputs.build_type }}" != "debug" ]; then
            FILES="$FILES app/build/outputs/apk/release/app-release.apk"
          fi
          gh release create "v$VERSION" $FILES \
            --title "Dockhand Android v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
