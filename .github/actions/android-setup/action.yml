name: Android setup
description: Install JDK 17, Android SDK 37 and Gradle cache

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "17"

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

    - name: Accept Android SDK licenses
      shell: bash
      run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Install SDK components
      shell: bash
      run: |
        if ! OUTPUT=$(sdkmanager "platforms;android-37.0" "build-tools;37.0.0" 2>&1); then
          echo "$OUTPUT"
          exit 1
        fi

    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
